<div class="reclamations-container">

  <div class="header-bar">
    <h2>Gestion des Réclamations</h2>

    <div class="actions">
      <input type="text" placeholder="Rechercher..." [(ngModel)]="searchTerm">

      <select [(ngModel)]="filterStatus">
        <option value="">Tous les statuts</option>
        <option value="en attente">En attente</option>
        <option value="répondu">Répondu</option>
      </select>
    </div>
  </div>

  <div class="table-wrapper" *ngIf="filteredReclamations.length > 0">

    <table class="styled-table">
      <thead>
        <tr>
          <th>Utilisateur</th>
          <th>Sujet</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let r of filteredReclamations">
          <td>{{ r.user?.nom }} {{ r.user?.prenom }}</td>
          <td>{{ r.sujet }}</td>

          <td>
            <span class="status" [ngClass]="r.status.replace(' ', '-')">{{ r.status }}</span>
          </td>

          <td class="action-btn">
            <button (click)="viewDetails(r._id)">
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

  </div>

  <div class="empty" *ngIf="filteredReclamations.length === 0">
    Aucune réclamation trouvée.
  </div>

</div>
